name: Update RoboForex Clients

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run updater
        env:
          ROBO_API_KEY: ${{ secrets.ROBO_API_KEY }}
          ROBO_ACCOUNT_ID: ${{ secrets.ROBO_ACCOUNT_ID }}
        run: |
          python update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ManusNexus.txt

          git diff --cached --quiet && exit 0

          git commit -m "Auto update RoboForex clients"

          git push
