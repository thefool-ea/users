name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          MASTER_ID="30281784"
          TEMP_FILE="raw_response.txt"
          CLEAN_IDS="clean_ids.txt"
          touch "$CLEAN_IDS"
          
          echo "🔄 Fetching all clients..."
          
          # Fetch using the most reliable endpoint
          curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/tree?account_id=$MASTER_ID&api_key=$API_KEY&limit=5000" > "$TEMP_FILE"
          
          # Extract IDs and CLEAN them:
          # 1. grep finds the ID pattern
          # 2. tr -d '\r' removes hidden Windows-style line breaks (the "huge space" cause)
          # 3. grep -oE '[0-9]+' extracts just the numbers
          grep -oE 'id[=": ]*[0-9]+' "$TEMP_FILE" | tr -d '\r' | grep -oE '[0-9]+' >> "$CLEAN_IDS" || true
          
          # Final processing:
          # - Add Master ID
          # - Remove duplicates
          # - Remove ALL blank lines
          # - Sort numerically
          (echo "$MASTER_ID"; cat "$CLEAN_IDS") | tr -d '\r' | sed '/^$/d' | sort -u -n > final_ids.txt
          
          ID_COUNT=$(wc -l < final_ids.txt)
          echo "📊 Found $ID_COUNT unique IDs"
          echo "ID_COUNT=$ID_COUNT" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          # Create file if it doesn't exist
          if [ ! -f "$FILE_PATH" ]; then
            echo "Auto Update Roboforex Clients:" > "$FILE_PATH"
          fi
          
          # CLEAN THE FILE FIRST: Remove any existing \r characters from the whole file
          tr -d '\r' < "$FILE_PATH" > temp_clean.txt && mv temp_clean.txt "$FILE_PATH"
          
          echo "📝 Updating $FILE_PATH..."
          
          # Delete everything from the "Auto Update" marker to the end
          sed -i '/Auto Update Roboforex Clients:/,$d' "$FILE_PATH"
          
          # Append the new clean section
          {
            echo "Auto Update Roboforex Clients:"
            echo ""
            echo "# Last updated: $TIMESTAMP"
            cat final_ids.txt
          } >> "$FILE_PATH"
          
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Found ${{ env.ID_COUNT }} clients (Clean Formatting)"
          file_pattern: ManusNexus.txt
