name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          # REPLACE WITH YOUR ACTIVE API KEY
          API_KEY="afcca115f0b8e8bd"
          
          IDS_RAW=$(curl -s "https://my.roboforex.com/api/partners/tree?account_id=30281784&api_key=$API_KEY" | grep -o 'id="[0-9]*"' | sed 's/id="//;s/"//')
          
          echo "ID_LIST<<EOF" >> $GITHUB_ENV
          echo "$IDS_RAW" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: $FILE_PATH does not exist!"
            exit 1
          fi
          
          # The 'd' command below permanently DELETES the old IDs (removes blank lines)
          sed -i '/Auto Update Roboforex Clients:/,$ {
            /Auto Update Roboforex Clients:/b
            d
          }' $FILE_PATH
          
          # Add the new IDs on the next line (cleaning up the whitespace)
          echo "" >> $FILE_PATH
          echo "${{ env.ID_LIST }}" >> $FILE_PATH

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Roboforex client IDs"
          file_pattern: ManusNexus.txt
