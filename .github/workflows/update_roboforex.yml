name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          MASTER_ID="30281784"
          ALL_IDS_FILE="all_ids.txt"
          touch "$ALL_IDS_FILE"
          
          echo "🔄 Fetching all clients using bulk strategy..."
          
          # Strategy: Try the 'clients' endpoint first with a huge limit
          # This is the most reliable way to get all 65+ IDs in one go.
          RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/clients?account_id=$MASTER_ID&api_key=$API_KEY&limit=5000")
          
          # Extract IDs and CLEAN them
          echo "$RESPONSE" | grep -oE 'id[=": ]*[0-9]+' | tr -d '\r' | grep -oE '[0-9]+' >> "$ALL_IDS_FILE" || true
          
          # Fallback: If 'clients' was empty, try 'tree' with a huge limit
          if [ ! -s "$ALL_IDS_FILE" ]; then
             echo "⚠️ 'clients' was empty, trying 'tree'..."
             RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/tree?account_id=$MASTER_ID&api_key=$API_KEY&limit=5000")
             echo "$RESPONSE" | grep -oE 'id[=": ]*[0-9]+' | tr -d '\r' | grep -oE '[0-9]+' >> "$ALL_IDS_FILE" || true
          fi

          # Final cleaning:
          # 1. Add Master ID
          # 2. Remove \r (huge spaces)
          # 3. Remove blank lines
          # 4. Remove duplicates
          # 5. Sort numerically
          (echo "$MASTER_ID"; cat "$ALL_IDS_FILE") | tr -d '\r' | sed '/^$/d' | sort -u -n > final_ids.txt
          
          ID_COUNT=$(wc -l < final_ids.txt)
          echo "📊 Total unique IDs found: $ID_COUNT"
          echo "ID_COUNT=$ID_COUNT" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Auto Update Roboforex Clients:" > "$FILE_PATH"
          fi
          
          # Clean existing file of any \r characters
          tr -d '\r' < "$FILE_PATH" > temp_clean.txt && mv temp_clean.txt "$FILE_PATH"
          
          echo "📝 Updating $FILE_PATH..."
          
          # Strip the old auto-update block
          sed -i '/Auto Update Roboforex Clients:/,$d' "$FILE_PATH"
          
          # Append the clean, tightly packed list
          {
            echo "Auto Update Roboforex Clients:"
            echo ""
            echo "# Last updated: $TIMESTAMP"
            cat final_ids.txt
          } >> "$FILE_PATH"
          
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Found ${{ env.ID_COUNT }} clients (Clean & Full List)"
          file_pattern: ManusNexus.txt
