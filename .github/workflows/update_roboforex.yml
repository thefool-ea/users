name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          ALL_IDS=""
          PAGE=1
          PREV_IDS=""

          echo "🔄 Starting safe paginated fetch..."
          
          while true; do
            # Fetch current page
            IDS_PAGE=$(curl -s -H "User-Agent: GitHub-Actions-Bot" "https://my.roboforex.com/api/partners/tree?account_id=30281784&api_key=$API_KEY&page=$PAGE&limit=100" | grep -oE 'id[=": ]*[0-9]+' | sed 's/id[=": ]*//g' || true)
            
            # ✅ SAFETY BREAK: If empty OR if it's the EXACT same list as the last page
            if [ -z "$IDS_PAGE" ] || [ "$IDS_PAGE" = "$PREV_IDS" ]; then
              echo "✅ Reached the end of the list after $((PAGE - 1)) pages."
              break
            fi
            
            PREV_IDS="$IDS_PAGE"
            if [ -n "$ALL_IDS" ]; then
              ALL_IDS="${ALL_IDS}\n${IDS_PAGE}"
            else
              ALL_IDS="$IDS_PAGE"
            fi
            
            PAGE=$((PAGE + 1))
          done

          # Remove blank lines, keep exact API order, and include master account 30281784
          ALL_IDS=$(echo -e "$ALL_IDS" | sed '/^$/d' | awk '!seen[$0]++')

          if [ -z "$ALL_IDS" ]; then
            echo "❌ Error: Failed to fetch RoboForex IDs. Check your API key!"
            exit 1
          fi

          ID_COUNT=$(echo "$ALL_IDS" | wc -l)
          echo "📊 Found $ID_COUNT client IDs in total"

          echo "ID_LIST<<EOF" >> $GITHUB_ENV
          echo "$ALL_IDS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: $FILE_PATH does not exist!"
            exit 1
          fi
          
          echo "📝 Updating $FILE_PATH..."
          
          # Preserve everything above "Auto Update"
          awk '/Auto Update Roboforex Clients:/ {exit} {print}' $FILE_PATH > temp.txt
          
          # Append new block
          echo "" >> temp.txt
          echo "Auto Update Roboforex Clients:" >> temp.txt
          echo "" >> temp.txt
          echo "# Last updated: $TIMESTAMP" >> temp.txt
          echo "${{ env.ID_LIST }}" >> temp.txt
          
          mv temp.txt $FILE_PATH
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Roboforex client IDs - $(date '+%Y-%m-%d %I:%M:%S %p')"
          file_pattern: ManusNexus.txt

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Workflow completed successfully!"
          echo "🔗 View file: https://github.com/thefool-ea/users/blob/main/ManusNexus.txt"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Workflow failed!"
          exit 1
