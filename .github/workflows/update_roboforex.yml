name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          MAX_RETRIES=3
          RETRY_COUNT=0
          ALL_IDS=""

          echo "🔄 Starting RoboForex API fetch..."
          
          # Fetch ALL IDs in a single request (the API returns the full tree)
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            IDS_RAW=$(curl -s -H "User-Agent: GitHub-Actions-Bot" "https://my.roboforex.com/api/partners/tree?account_id=30281784&api_key=$API_KEY&limit=9999" | grep -oE 'id[=": ]*[0-9]+' | sed 's/id[=": ]*//g' || true)
            
            if [ -n "$IDS_RAW" ]; then
              ALL_IDS="$IDS_RAW"
              echo "✅ Successfully fetched IDs"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ Attempt failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

          # Keep exact API order, remove blank lines and duplicates, include master account
          ALL_IDS=$(echo -e "$ALL_IDS" | sed '/^$/d' | awk '!seen[$0]++')

          if [ -z "$ALL_IDS" ]; then
            echo "❌ Error: Failed to fetch RoboForex IDs. Check your API key secret!"
            exit 1
          fi

          ID_COUNT=$(echo "$ALL_IDS" | wc -l)
          echo "📊 Found $ID_COUNT client IDs in total"

          echo "ID_LIST<<EOF" >> $GITHUB_ENV
          echo "$ALL_IDS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: $FILE_PATH does not exist!"
            exit 1
          fi
          
          echo "📝 Updating $FILE_PATH..."
          
          # Preserve everything above "Auto Update"
          awk '/Auto Update Roboforex Clients:/ {exit} {print}' $FILE_PATH > temp.txt
          
          # Append new block
          echo "" >> temp.txt
          echo "Auto Update Roboforex Clients:" >> temp.txt
          echo "" >> temp.txt
          echo "# Last updated: $TIMESTAMP" >> temp.txt
          echo "${{ env.ID_LIST }}" >> temp.txt
          
          mv temp.txt $FILE_PATH
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Roboforex client IDs - $(date '+%Y-%m-%d %I:%M:%S %p')"
          file_pattern: ManusNexus.txt

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Workflow completed successfully!"
          echo "🔗 View file: https://github.com/thefool-ea/users/blob/main/ManusNexus.txt"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Workflow failed!"
          exit 1
