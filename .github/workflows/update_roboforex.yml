name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          MASTER_ID="30281784"
          TEMP_FILE="raw_response.txt"
          CLEAN_IDS="clean_ids.txt"
          touch "$CLEAN_IDS"
          
          echo "🔄 Attempting to fetch all clients..."
          
          # Strategy 1: Try the 'clients' endpoint (best for flat lists of all referrals)
          # We use a large limit to get everything in one go if possible
          curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/clients?account_id=$MASTER_ID&api_key=$API_KEY&limit=5000" > "$TEMP_FILE"
          
          # Extract IDs from the response
          grep -oE 'id[=": ]*[0-9]+' "$TEMP_FILE" | grep -oE '[0-9]+' >> "$CLEAN_IDS" || true
          
          # Strategy 2: If 'clients' was empty, fall back to 'tree' but with a large limit
          if [ ! -s "$CLEAN_IDS" ]; then
            echo "⚠️ 'clients' endpoint returned no IDs, falling back to 'tree'..."
            curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/tree?account_id=$MASTER_ID&api_key=$API_KEY&limit=5000" > "$TEMP_FILE"
            grep -oE 'id[=": ]*[0-9]+' "$TEMP_FILE" | grep -oE '[0-9]+' >> "$CLEAN_IDS" || true
          fi

          # Final processing:
          # 1. Add Master ID
          # 2. Remove duplicates
          # 3. Remove empty lines
          # 4. Sort numerically
          (echo "$MASTER_ID"; cat "$CLEAN_IDS") | sed '/^$/d' | sort -u -n > final_ids.txt
          
          ID_COUNT=$(wc -l < final_ids.txt)
          echo "📊 Total unique IDs found: $ID_COUNT"
          echo "ID_COUNT=$ID_COUNT" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Auto Update Roboforex Clients:" > "$FILE_PATH"
          fi
          
          echo "📝 Updating $FILE_PATH..."
          
          # Remove the old "Auto Update" section if it exists
          # This command deletes from the marker to the end of file
          sed -i '/Auto Update Roboforex Clients:/,$d' "$FILE_PATH"
          
          # Append the new section
          {
            echo "Auto Update Roboforex Clients:"
            echo ""
            echo "# Last updated: $TIMESTAMP"
            cat final_ids.txt
          } >> "$FILE_PATH"
          
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Found ${{ env.ID_COUNT }} RoboForex clients"
          file_pattern: ManusNexus.txt

      - name: Notify on success
        if: success()
        run: echo "✅ Done! ${{ env.ID_COUNT }} IDs saved to ManusNexus.txt"
