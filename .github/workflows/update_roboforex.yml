name: Auto Update Roboforex Clients

on:
  schedule:
    - cron: '0 * * * *' # Updated to run every hour instead of every minute to be safe
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse RoboForex IDs
        id: get_ids
        run: |
          API_KEY="${{ secrets.ROBOFOREX_API_KEY }}"
          MASTER_ID="30281784"
          ALL_IDS_FILE="all_ids.txt"
          touch "$ALL_IDS_FILE"
          
          PAGE=1
          echo "🔄 Starting robust fetch..."
          
          while true; do
            echo "Fetching page $PAGE..."
            # Using a more robust double-grep to ensure we get clean digits only
            # We try 'partners/clients' first as it is the standard for flat lists
            # If that fails, it falls back to 'partners/tree'
            RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" "https://my.roboforex.com/api/partners/tree?account_id=$MASTER_ID&api_key=$API_KEY&page=$PAGE&limit=100")
            
            # Extract IDs: matches 'id="12345"' or '"id":12345' and then pulls just the digits
            IDS_PAGE=$(echo "$RESPONSE" | grep -oE 'id[=": ]*[0-9]+' | grep -oE '[0-9]+' || true)
            
            if [ -z "$IDS_PAGE" ]; then
              echo "✅ No more IDs found on page $PAGE."
              break
            fi
            
            # Check if we got the same IDs as before (pagination end)
            if grep -qF "$(echo "$IDS_PAGE" | head -n 1)" "$ALL_IDS_FILE" 2>/dev/null && [ $PAGE -gt 1 ]; then
              echo "✅ Reached the end of unique IDs."
              break
            fi
            
            echo "$IDS_PAGE" >> "$ALL_IDS_FILE"
            
            # Safety break to prevent infinite loops
            if [ $PAGE -ge 50 ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          # Add the master ID, remove duplicates, and remove empty lines
          (echo "$MASTER_ID"; cat "$ALL_IDS_FILE") | sed '/^$/d' | sort -u > final_ids.txt
          
          ID_COUNT=$(wc -l < final_ids.txt)
          echo "📊 Found $ID_COUNT client IDs in total"
          
          # Store in a file to avoid environment variable size limits
          echo "ID_COUNT=$ID_COUNT" >> $GITHUB_ENV

      - name: Update the text file
        run: |
          FILE_PATH="ManusNexus.txt"
          TIMESTAMP=$(TZ='Asia/Bangkok' date '+%Y-%m-%d %I:%M:%S %p')
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Auto Update Roboforex Clients:" > "$FILE_PATH"
          fi
          
          echo "📝 Updating $FILE_PATH..."
          
          # Preserve everything above the update block
          sed -i '/Auto Update Roboforex Clients:/,$d' "$FILE_PATH"
          
          # Append the new data
          {
            echo "Auto Update Roboforex Clients:"
            echo ""
            echo "# Last updated: $TIMESTAMP"
            cat final_ids.txt
          } >> "$FILE_PATH"
          
          echo "✅ File updated successfully"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Roboforex client IDs (${{ env.ID_COUNT }} clients) - $(date '+%Y-%m-%d %I:%M:%S %p')"
          file_pattern: ManusNexus.txt

      - name: Notify on success
        if: success()
        run: echo "✅ Workflow completed successfully! Found ${{ env.ID_COUNT }} IDs."
